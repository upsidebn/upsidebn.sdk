[package]
name = "nrn-sdk"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
authors = ["Nextwaves Industries <tech@nextwaves.industries>"]
description = "Rust SDK for communicating with Nextwaves NRN RFID readers over serial."
readme = "README.md"
homepage = "https://nextwaves.com"
documentation = "https://docs.rs/nrn-sdk"
repository = "https://github.com/Nextwaves-Industries/nextwaves-sdk"
license = "MIT"
keywords = ["rfid", "serial", "reader", "nrn", "uhf"]
categories = ["hardware-support", "embedded", "api-bindings"]

[features]
default = []
hardware-tests = []

[dependencies]
byteorder = "1.5"
log = "0.4"
serialport = "4.3"
thiserror = "1.0"

[dev-dependencies]
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
multiple_crate_versions = "allow"
missing_const_for_fn = "allow"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
