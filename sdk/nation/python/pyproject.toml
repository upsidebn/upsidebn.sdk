[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nrn-sdk"
version = "1.0.0"
description = "Python SDK for NRN RFID readers by Upside."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Upside", email = "inquiry@upsidebn.com" }
]
keywords = ["rfid", "uhf", "serial", "reader", "nrn"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Hardware :: Hardware Drivers"
]
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = [
  "build",
  "pytest>=7",
  "pytest-cov",
  "ruff>=0.6",
  "twine"
]

[project.urls]
Homepage = "https://upsidebn.com"
Repository = "https://github.com/upsidebn/upsidebn.sdk"
Issues = "https://github.com/upsidebn/upsidebn.sdk/issues"

[tool.setuptools]
py-modules = ["nrn"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires a real reader on NRN_SERIAL_PORT"
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["E501", "N802", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "SIM"]

[tool.ruff.format]
quote-style = "double"
