name: Release

on:
  workflow_dispatch:

jobs:
  router:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.parse.outputs.kind }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == sdk/nation/go/v* ]]; then
            echo "kind=go" >> "$GITHUB_OUTPUT"
            echo "version=${tag##sdk/nation/go/v}" >> "$GITHUB_OUTPUT"
          else
            echo "kind=root" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          fi

  python:
    needs: router
    if: needs.router.outputs.kind == 'root'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build && twine check dist/*
        working-directory: sdk/nation/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/nation/python/dist

  rust:
    needs: router
    if: needs.router.outputs.kind == 'root'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --dry-run
        working-directory: sdk/nation/rust
      - run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
        working-directory: sdk/nation/rust

  webserial:
    needs: router
    if: needs.router.outputs.kind == 'root'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - run: npm install
        working-directory: sdk/nation/webserial
      - run: npm run build
        working-directory: sdk/nation/webserial
      - run: npm publish --dry-run
        working-directory: sdk/nation/webserial
      - run: npm publish --provenance --access public
        working-directory: sdk/nation/webserial
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  cpp:
    needs: router
    if: needs.router.outputs.kind == 'root'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DNRN_BUILD_TESTS=ON
        working-directory: sdk/nation/cpp
      - run: cmake --build build --config Release
        working-directory: sdk/nation/cpp
      - run: ctest --test-dir build --output-on-failure -C Release
        working-directory: sdk/nation/cpp
      - uses: actions/upload-artifact@v4
        with:
          name: cpp-${{ matrix.os }}
          path: sdk/nation/cpp/build

  go:
    needs: router
    if: needs.router.outputs.kind == 'go'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - run: go vet ./...
        working-directory: sdk/nation/go
      - run: go test ./...
        working-directory: sdk/nation/go
      - run: go list -m github.com/Nextwaves-Industries/nextwaves-sdk/sdk/nation/go@v${{ needs.router.outputs.version }}

  github-release:
    needs: [router, python, rust, webserial, cpp, go]
    if: always() && (needs.router.outputs.kind == 'root' || needs.router.outputs.kind == 'go')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
